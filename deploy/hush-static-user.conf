# Drop-in for hosts that cannot set up a mount namespace, such as an unprivileged LXC with nesting=0, where the
# full unit fails with status=226/NAMESPACE. It runs the Server as a static `hush` user and turns
# off every directive that needs a mount namespace; the rest of hush.service's hardening still applies.
#   sudo useradd --system --home-dir /nonexistent --shell /usr/sbin/nologin hush
#   sudo install -D -m 0644 deploy/hush-static-user.conf /etc/systemd/system/hush.service.d/static-user.conf
#   sudo systemctl daemon-reload && sudo systemctl restart hush

[Service]
DynamicUser=no
User=hush
Group=hush
ProtectSystem=no
ProtectHome=no
PrivateTmp=no
PrivateDevices=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectControlGroups=no
